# Fly.io config for "Our Expenses". Rename `app` to something unique before deploying —
# Fly app names are global, so "our-expenses" is almost certainly taken.
app = "our-expenses-changeme"
primary_region = "iad"

[build]

[env]
  PORT = "4000"
  DB_DIR = "/data"

[[mounts]]
  source = "expense_data"
  destination = "/data"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
